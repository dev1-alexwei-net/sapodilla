"""Mock Ollama override for the test compose stack.

Replaces the real ollama image with a tiny Python stdlib mock so tests
are hermetic (no model downloads, no secrets).
"""
services:
  ollama:
    image: python:3.12-slim
    command: ["python", "/app/app.py", "--port", "11434"]
    volumes:
      - ./tests/mock_upstream/app.py:/app/app.py:ro
    environment: []
    # no GPU, no data volume needed
    volumes_from: []
    # clear the original volume binding
    # (docker-compose merge: empty list wins)
    # keep the port mapping
    ports:
      - "11434:11434"

  sidecar:
    # sidecar must see the upstream as `ollama:11434` (docker network)
    environment:
      - OLLAMA_UPSTREAM=http://ollama:11434
