[project]
name = "ollama-mirror"
version = "0.1.0"
requires-python = ">=3.9"

[project.optional-dependencies]
test = ["pytest>=7", "requests>=2.28"]
dev = ["ruff>=0.4"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
]
ignore = [
    "S101",  # assert in tests is fine
    "E501",  # line length handled by formatter
    "S104",  # 0.0.0.0 binding is intentional for mock servers / test fixtures
    "S113",  # requests in tests target local fixtures; timeouts would slow tests
    "S310",  # urllib.request.urlopen targets local test fixtures
]

[tool.ruff.lint.per-file-ignores]
"conftest.py" = ["S603", "S607", "S110", "SIM105", "N806"]
"test_*.py" = ["S101", "S603", "S607", "S110", "SIM105", "N806"]
"mock-ollama/**" = ["S603", "S607", "S110", "SIM105"]
"scripts/**" = ["S603", "S607", "S110", "SIM105"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["."]
filterwarnings = ["ignore::UserWarning"]
