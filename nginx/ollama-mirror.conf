# NGINX configuration for ollama-mirror.
#
# Architecture:
#   Client -> NGINX (port 8080) -> Ollama upstream (port 11434)
#                  |
#                  +-- mirror --> sidecar /track (port 9090)
#
# The mirror directive fires a side request to the sidecar for every
# request. The client response is unaffected.
#
# The sidecar extracts the "model" field from the JSON body to record
# usage. The mirror_request_body directive controls whether the body
# is forwarded to the mirror subrequest.
#
# NOTE: NGINX mirror + proxy_pass_request_body has a known limitation:
# the mirror subrequest does NOT automatically get the request body.
# We use a workaround: the sidecar reads the model from the
# X-Original-Body header (base64-encoded) or from the body if present.
#
# Usage: mount this file into the NGINX container at
#       /etc/nginx/conf.d/ollama-mirror.conf

upstream ollama_upstream {
    server ollama:11434;
    keepalive 32;
}

upstream mirror_sidecar {
    server sidecar:9090;
    keepalive 8;
}

server {
    listen 8080;
    server_name _;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # ---- NGINX health ----
    location = /healthz {
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    # ---- Ollama API pass-through ----
    location / {
        # Fire-and-forget to sidecar
        mirror /mirror-track;
        mirror_request_body on;

        # Proxy to Ollama
        proxy_pass http://ollama_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        # Streaming support (Ollama uses chunked responses)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;

        # CORS
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # ---- Mirror target: forward body to sidecar ----
    location = /mirror-track {
        internal;
        # Pass the body through. NGINX mirror subrequests can carry
        # the body when mirror_request_body is on, but the sidecar
        # must be able to handle both cases.
        proxy_pass http://mirror_sidecar/track;
        proxy_set_header Connection "";
        proxy_set_header X-Request-Source "nginx-mirror";
    }
}
