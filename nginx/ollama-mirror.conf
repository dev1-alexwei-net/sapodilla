# Generic web-API mirror.
#
# Proxies EVERY request to the upstream API and mirrors each request
# (fire-and-forget) to the sidecar for usage accounting. The sidecar tracks
# only the total request count and the time of the last request; it does not
# inspect or store request bodies or endpoint details.
#
# Upstream is set via the UPSTREAM env var (host:port) in docker-compose.

upstream backend {
    server $UPSTREAM;
}

server {
    listen 8080;
    server_name _;

    client_max_body_size 512m;

    location / {
        # Mirror the request (fire-and-forget) to the sidecar for counting.
        mirror /track-sidecar;
        mirror_request_body off;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # Internal mirror target: the sidecar counts the request.
    location = /track-sidecar {
        internal;
        proxy_pass http://sidecar:9090/track;
        proxy_set_header Content-Length "";
    }
}
