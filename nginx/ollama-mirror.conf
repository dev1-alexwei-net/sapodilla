# Generic web-API mirror.
#
# Proxies EVERY request to the upstream API and mirrors each request
# (fire-and-forget) to the usage API for accounting. It tracks
# only the total request count and the time of the last request; it does not
# inspect or store request bodies or endpoint details.
#
# Host and port variables are rendered at container startup by envsubst.

upstream backend {
    server $UPSTREAM_HOST:$UPSTREAM_PORT;
}

upstream sapodilla {
    server $SAPODILLA_HOST:$SAPODILLA_PORT;
}

server {
    listen $LISTEN_PORT;
    server_name _;

    client_max_body_size 512m;

    location / {
        # Mirror the request (fire-and-forget) to the usage API for counting.
        mirror /track-sapodilla;
        mirror_request_body off;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # Internal mirror target: the usage API counts the request.
    location = /track-sapodilla {
        internal;
        proxy_pass http://sapodilla/track;
        proxy_set_header Content-Length "";
    }
}
