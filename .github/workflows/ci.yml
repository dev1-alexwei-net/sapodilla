name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  GO_VERSION: "1.23"
  IMAGE_PREFIX: "ghcr.io/dev1-alexwei-net/ollama-mirror"

jobs:
  go-test:
    name: Go vet + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: gofmt check
        run: |
          out="$(cd sidecar && gofmt -l .)"
          if [ -n "$out" ]; then
            echo "::error::The following files need gofmt (run 'gofmt -w .'):" 
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: cd sidecar && go vet ./...

      - name: go test -race
        run: cd sidecar && go test -race -v ./...

      - name: Save test results
        if: always()
        run: |
          mkdir -p /tmp/test-logs
          cd sidecar && go test -race -v -json ./... > /tmp/test-logs/go-test.json 2>&1 || true
          echo '{"summary":"go test results"}' > /tmp/test-logs/manifest.json

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-test-logs
          path: /tmp/test-logs
          retention-days: 7

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sidecar image
        run: docker build -t ollama-mirror:ci sidecar/

      - name: Build nginx image
        run: docker build -t ollama-mirror-nginx:ci -f nginx/Dockerfile nginx/

      - name: Build mock-ollama image
        run: docker build -t ollama-mirror-mock:ci -f mock-ollama/Dockerfile mock-ollama/

      - name: Verify images
        run: |
          docker images | grep ollama-mirror
          echo "Images built successfully"

  smoke:
    name: Smoke test (Docker Compose)
    runs-on: ubuntu-latest
    needs: [go-test, docker-build]
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: |
          docker compose up -d
          echo "Stack started"

      - name: Wait for sidecar
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:9090/api/healthz >/dev/null 2>&1; then
              echo "Sidecar ready after ${i}s"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::Sidecar never became ready"
              docker compose logs || true
              exit 1
            fi
            sleep 1
          done

      - name: Wait for proxy (backend ready)
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/api/tags 2>/dev/null | python3 -m json.tool >/dev/null 2>&1; then
              echo "Proxy + backend ready after ${i}s"
              break
            fi
            if [ "$i" -eq 90 ]; then
              echo "::error::Proxy or backend never became ready"
              docker compose logs || true
              exit 1
            fi
            sleep 1
          done

      - name: Health check
        run: |
          echo "=== Sidecar healthz ==="
          curl -sf http://localhost:9090/api/healthz
          echo ""
          echo "=== Proxy reachable ==="
          curl -s -o /dev/null -w 'HTTP %{http_code}\n' http://localhost:8080/
          echo ""

      - name: Tags passthrough
        run: |
          echo "=== Tags via proxy ==="
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8080/api/tags | python3 -m json.tool; then
              exit 0
            fi
            echo "Retry $i/10..."
            sleep 1
          done
          echo "::error::Tags endpoint never returned valid JSON"
          exit 1

      - name: Usage endpoint
        run: |
          echo "=== Usage via sidecar ==="
          curl -sf http://localhost:9090/api/usage | python3 -m json.tool
          echo ""

      - name: Make a tracked request
        run: |
          echo "=== Making a chat request ==="
          curl -sf http://localhost:8080/api/chat \
            -H 'Content-Type: application/json' \
            -d '{
              "model": "llama3.2:1b",
              "messages": [{"role": "user", "content": "hello"}],
              "stream": false
            }' | python3 -m json.tool
          echo ""

      - name: Verify tracking
        run: |
          echo "=== Usage after request (via sidecar) ==="
          curl -sf http://localhost:9090/api/usage | python3 -m json.tool
          echo ""
          echo "=== Checking total > 0 ==="
          total=$(curl -sf http://localhost:9090/api/usage | python3 -c "import json,sys; print(json.load(sys.stdin)['total'])")
          if [ "$total" -gt 0 ]; then
            echo "PASS: total=$total"
          else
            echo "::error::FAIL: total=$total (expected > 0)"
            exit 1
          fi

      - name: Dump logs on failure
        if: failure()
        run: |
          echo "=== Docker compose logs ==="
          docker compose logs --no-color || true

      - name: Save smoke results
        if: always()
        run: |
          mkdir -p /tmp/test-logs
          docker compose logs --no-color > /tmp/test-logs/compose-logs.txt 2>&1 || true
          echo '{"summary":"smoke test results"}' > /tmp/test-logs/manifest.json

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-logs
          path: /tmp/test-logs
          retention-days: 7

      - name: Teardown
        if: always()
        run: docker compose down || true

  # ------------------------------------------------------------------
  # GHCR publish — only on push to main, builds per-arch images in
  # parallel, then assembles a multi-arch manifest.
  # ------------------------------------------------------------------
  ghcr-publish:
    name: "Publish ${{ matrix.arch }}"
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (cross-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push sidecar (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: ./sidecar
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}:latest-${{ matrix.arch }}
            ${{ env.IMAGE_PREFIX }}:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=sidecar-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=sidecar-${{ matrix.arch }}

      - name: Build and push nginx (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-nginx:latest-${{ matrix.arch }}
            ${{ env.IMAGE_PREFIX }}-nginx:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=nginx-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=nginx-${{ matrix.arch }}

  # ------------------------------------------------------------------
  # Multi-arch manifest — runs after both arch jobs complete.
  # Uses the manifest-tool approach: create a manifest list that
  # references the per-arch images already pushed above.
  # ------------------------------------------------------------------
  manifest-push:
    name: Push multi-arch manifests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ghcr-publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push sidecar manifest
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE_PREFIX }}:latest \
            -t ${{ env.IMAGE_PREFIX }}:${{ github.sha }} \
            ${{ env.IMAGE_PREFIX }}:latest-amd64 \
            ${{ env.IMAGE_PREFIX }}:latest-arm64

      - name: Create and push nginx manifest
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE_PREFIX }}-nginx:latest \
            -t ${{ env.IMAGE_PREFIX }}-nginx:${{ github.sha }} \
            ${{ env.IMAGE_PREFIX }}-nginx:latest-amd64 \
            ${{ env.IMAGE_PREFIX }}-nginx:latest-arm64

      - name: Verify manifests
        run: |
          docker buildx imagetools inspect ${{ env.IMAGE_PREFIX }}:latest
          docker buildx imagetools inspect ${{ env.IMAGE_PREFIX }}-nginx:latest
