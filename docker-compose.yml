# Generic web-API usage tracker.
#
# Any HTTP/HTTPS endpoint can be used as the upstream: the mirror proxies
# every request to it and the sidecar counts them. Set UPSTREAM to point at
# your real API (e.g. http://ollama:11434, http://myapp:8080, ...).
#
# The bundled `upstream` service is a generic mock that echoes requests back
# as JSON, so the whole stack can run with no external dependency.

services:
  nginx:
    build:
      context: ./nginx
    ports:
      - "${NGINX_BIND:-0.0.0.0}:8080:8080"
    environment:
      # Upstream = the API the mirror fronts. Default is the generic mock.
      UPSTREAM: "${UPSTREAM:-upstream:11434}"
    depends_on:
      sidecar:
        condition: service_healthy
      upstream:
        condition: service_started
    networks:
      - mirror
    restart: unless-stopped

  sidecar:
    build:
      context: ./sidecar
    ports:
      - "127.0.0.1:9090:9090"
    environment:
      STATE_DIR: "/data"
    volumes:
      - sidecar-data:/data
    networks:
      - mirror
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/api/healthz"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 3s

  # Generic mock upstream (echoes requests). Replace with a real API in
  # production by dropping this service and setting UPSTREAM.
  upstream:
    build:
      context: ./upstream
    expose:
      - "11434"
    networks:
      - mirror
    restart: unless-stopped

networks:
  mirror:
    driver: bridge

volumes:
  sidecar-data:
