# Generic web-API usage tracker.
#
# Point UPSTREAM_HOST and UPSTREAM_PORT at any HTTP service reachable from
# the mirror network. The bundled upstream is a generic mock for local use.
#
# The bundled `upstream` service is a generic mock that echoes requests back
# as JSON, so the whole stack can run with no external dependency.

services:
  nginx:
    build:
      context: ./nginx
    ports:
      - "${LISTEN_HOST:-0.0.0.0}:${LISTEN_PORT:-8080}:${LISTEN_PORT:-8080}"
    environment:
      LISTEN_PORT: "${LISTEN_PORT:-8080}"
      UPSTREAM_HOST: "${UPSTREAM_HOST:-upstream}"
      UPSTREAM_PORT: "${UPSTREAM_PORT:-11434}"
      SIDECAR_HOST: "${SIDECAR_HOST:-sidecar}"
      SIDECAR_PORT: "${SIDECAR_PORT:-9090}"
    depends_on:
      sidecar:
        condition: service_healthy
      upstream:
        condition: service_started
    networks:
      - mirror
    restart: unless-stopped

  sidecar:
    build:
      context: ./sidecar
    ports:
      - "127.0.0.1:${SIDECAR_PORT:-9090}:${SIDECAR_PORT:-9090}"
    environment:
      SIDECAR_PORT: "${SIDECAR_PORT:-9090}"
      ADDR: "${ADDR:-:${SIDECAR_PORT:-9090}}"
    networks:
      - mirror
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${SIDECAR_PORT}/api/healthz"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 3s

  # Generic mock upstream (echoes requests). Replace with a real API in
  # production can point NGINX at another service with UPSTREAM_HOST/PORT.
  upstream:
    build:
      context: ./upstream
    expose:
      - "${UPSTREAM_PORT:-11434}"
    environment:
      PORT: "${UPSTREAM_PORT:-11434}"
    networks:
      - mirror
    restart: unless-stopped

networks:
  mirror:
    driver: bridge

