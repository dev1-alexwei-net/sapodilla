services:
  # Ollama model server (mock or real).
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    restart: unless-stopped

  # Usage-tracking sidecar (Go, stdlib only)
  sidecar:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9090:9090"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/api/healthz"]
      interval: 5s
      timeout: 2s
      retries: 3

  # NGINX pass-through proxy with mirror to sidecar
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - ollama
      - sidecar
    restart: unless-stopped

volumes:
  ollama_data:
