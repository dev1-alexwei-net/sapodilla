services:
  # Ollama model server (mock or real).
  ollama:
    build:
      context: mock-ollama
      dockerfile: Dockerfile
    ports:
      - "11434:11434"
    restart: unless-stopped

  # Usage-tracking sidecar (Go, stdlib only)
  sidecar:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9090:9090"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/api/healthz"]
      interval: 5s
      timeout: 2s
      retries: 3

  # NGINX pass-through proxy with mirror to sidecar
  nginx:
    build:
      context: nginx
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - ollama
      - sidecar
    restart: unless-stopped
